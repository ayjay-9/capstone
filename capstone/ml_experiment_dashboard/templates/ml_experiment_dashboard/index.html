{% extends "ml_experiment_dashboard/layout.html" %}

{% block body %}
    <h2>{{ user.first_name }} {{ user.last_name }}</h2>
    {% if user.is_authenticated %}
        <!--Only authenticated users can upload the dataset-->
        {% if message %}
            <div>{{ message }}</div>
        {% endif %}
        <form action="{% url 'index' %}" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <label for="dataset" class="drop-zone" id="drop-zone">
                <span id="drop-zone-text">Drag &amp; drop a CSV here, or click to browse</span>
                <input type="file" name="dataset" id="dataset" accept=".csv" class="drop-zone-input">
            </label>
            <input type="submit" id="upload-data-set" value="Upload">
        </form>
    {% else %}
        <p>Please log in or register to upload a dataset.</p>
    {% endif %}
{% endblock %}
